<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Playlist Migrator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&display=swap"
    rel="stylesheet"
  >
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('playlist-migrator:theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
        }
      } catch (error) {
        /* sin almacenamiento disponible: se queda con el tema claro */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
